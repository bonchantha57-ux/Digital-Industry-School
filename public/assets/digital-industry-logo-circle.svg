<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520">
  <defs>
    <clipPath id="circleClip">
      <circle cx="260" cy="260" r="256" />
    </clipPath>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>
  <!-- Base background -->
  <circle cx="260" cy="260" r="259" fill="#0B1220" />
  <!-- Perfectly centered and cropped circular image -->
  <g clip-path="url(#circleClip)">
    <image href="/assets/digital-industry-logo.png" x="-252" y="-20" width="1024" height="559" />
  </g>
  <!-- Sleek cyber-neon border ring -->
  <circle cx="260" cy="260" r="256" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.85" />
</svg>
