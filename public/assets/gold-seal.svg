<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <linearGradient id="goldGradBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC" />
      <stop offset="25%" stop-color="#F3C649" />
      <stop offset="50%" stop-color="#B8860B" />
      <stop offset="75%" stop-color="#FEE180" />
      <stop offset="100%" stop-color="#7B5404" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#800000" />
      <stop offset="50%" stop-color="#B22222" />
      <stop offset="100%" stop-color="#600000" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#badgeShadow)">
    <!-- Hanging Ribbons -->
    <polygon points="50,110 30,195 55,180 75,195 65,110" fill="url(#ribbonGrad)" stroke="#500000" stroke-width="1"/>
    <polygon points="95,110 85,195 105,180 130,195 110,110" fill="url(#ribbonGrad)" stroke="#500000" stroke-width="1"/>
    <!-- Gold Ribbon Border lines -->
    <polyline points="35,188 55,175 70,188" stroke="#F3C649" stroke-width="1.5" fill="none" />
    <polyline points="90,188 105,175 125,188" stroke="#F3C649" stroke-width="1.5" fill="none" />

    <!-- Starburst Medallion (24 spikes) -->
    <g transform="translate(80, 75)">
      <!-- Outer teeth -->
      <circle cx="0" cy="0" r="62" fill="url(#goldGradBadge)" />
      <!-- Star polygon teeth effect -->
      <path d="M 0,-64 L 8,-56 L 16,-62 L 23,-53 L 32,-56 L 37,-46 L 47,-46 L 49,-35 L 58,-32 L 58,-21 L 64,-16 L 61,-5 L 65,5 L 59,15 L 61,26 L 53,34 L 52,45 L 42,50 L 39,60 L 28,62 L 23,70 L 12,69 L 5,74 L -5,74 L -12,69 L -23,70 L -28,62 L -39,60 L -42,50 L -52,45 L -53,34 L -61,26 L -59,15 L -65,5 L -61,-5 L -64,-16 L -58,-21 L -58,-32 L -49,-35 L -47,-46 L -37,-46 L -32,-56 L -23,-53 L -16,-62 L -8,-56 Z" fill="url(#goldGradBadge)" stroke="#8A6305" stroke-width="1" />
      
      <!-- Inner Ring -->
      <circle cx="0" cy="0" r="50" fill="url(#goldGradBadge)" stroke="#FFE898" stroke-width="2" />
      <circle cx="0" cy="0" r="44" fill="none" stroke="#7A5200" stroke-width="1.5" stroke-dasharray="3 2" />
      <circle cx="0" cy="0" r="39" fill="#9B111E" stroke="#F3C649" stroke-width="2" />

      <!-- Center Text & Stars -->
      <polygon points="0,-22 4,-12 14,-12 6,-6 9,4 0,-2 -9,4 -6,-6 -14,-12 -4,-12" fill="#FFE898" />
      <text x="0" y="5" font-family="'Cinzel', 'Inter', sans-serif" font-size="7.5" font-weight="900" fill="#FFF" text-anchor="middle" letter-spacing="1">
        GOLD
      </text>
      <text x="0" y="15" font-family="'Cinzel', 'Inter', sans-serif" font-size="6.5" font-weight="700" fill="#FFE898" text-anchor="middle" letter-spacing="1">
        STANDARD
      </text>
      <text x="0" y="27" font-family="'Battambang', sans-serif" font-size="6.5" font-weight="bold" fill="#FFF" text-anchor="middle">
        ឧត្តមភាព
      </text>
    </g>
  </g>
</svg>
