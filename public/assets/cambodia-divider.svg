<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 40" width="500" height="40">
  <defs>
    <linearGradient id="dividerGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0" />
      <stop offset="25%" stop-color="#C5A059" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#E2B755" />
      <stop offset="50%" stop-color="#FFF4CE" />
      <stop offset="55%" stop-color="#E2B755" />
      <stop offset="75%" stop-color="#C5A059" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Main horizontal line -->
  <line x1="10" y1="20" x2="490" y2="20" stroke="url(#dividerGold)" stroke-width="1.8" />
  <line x1="80" y1="24" x2="420" y2="24" stroke="url(#dividerGold)" stroke-width="0.8" opacity="0.6" />

  <!-- Center Khmer motif (Kbach Phka Chan / Lotus Flower Flame) -->
  <g transform="translate(250, 20)" fill="url(#dividerGold)">
    <!-- Central lotus bud -->
    <path d="M 0 -16 C 5 -8, 8 -3, 0 8 C -8 -3, -5 -8, 0 -16 Z" />
    <!-- Left petal -->
    <path d="M 0 0 C -8 -12, -22 -10, -22 2 C -14 6, -8 4, 0 4 Z" />
    <!-- Right petal -->
    <path d="M 0 0 C 8 -12, 22 -10, 22 2 C 14 6, 8 4, 0 4 Z" />
    <!-- Center diamond jewel -->
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#FFF9E6" />
    <!-- Side scrolls -->
    <circle cx="-35" cy="0" r="2.5" fill="#E2B755" />
    <circle cx="35" cy="0" r="2.5" fill="#E2B755" />
    <circle cx="-50" cy="0" r="1.5" fill="#C5A059" />
    <circle cx="50" cy="0" r="1.5" fill="#C5A059" />
  </g>
</svg>
